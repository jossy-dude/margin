name: Release APK

# On demand only: by hand from the Actions tab, or when a v* tag is pushed.
# Not on every push.
on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'dev = debug key, app.marginalia.planner.dev (installs beside the real app) · over = debug key on the real id (installs over v0.1.0/0.3.1) · release = the release key from secrets'
        type: choice
        options: [dev, over, release]
        default: dev
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    # A wedged Gradle run must fail visibly instead of burning six hours of Actions time.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # RN 0.86 / AGP 8.x / Gradle 9 want JDK 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Toolchain versions
        run: |
          echo "== java =="; java -version
          echo "== node =="; node --version
          echo "== ANDROID_HOME = ${ANDROID_HOME:-unset} (runner-preinstalled SDK)"
          ls "${ANDROID_HOME:-/nonexistent}/platforms" 2>/dev/null || true
          chmod +x android/gradlew
          echo "== gradle =="
          (cd android && ./gradlew --version --no-daemon)

      - name: Install
        run: npm ci

      # Built from the committed android/ folder — no `expo prebuild`. Always `assembleRelease`: the JS is
      # bundled inside the APK and it boots straight into the app. The variant picks the id and the key
      # (android/app/build.gradle): dev and over use the committed debug keystore, release the owner's key.
      # A tag build is always the release key; a by-hand run builds the variant asked for.
      - name: Pick the variant
        id: variant
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then V=release; else V="${{ inputs.variant || 'dev' }}"; fi
          echo "variant=$V" >> "$GITHUB_OUTPUT"
          echo "Building variant: $V"

      # The keystore exists only for the length of this job, in the runner's temp folder, never in the tree.
      - name: Decode the release key
        if: steps.variant.outputs.variant == 'release'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::variant=release needs the ANDROID_KEYSTORE_BASE64 secret (docs/RELEASING.md)"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/margin-release.keystore"
          echo "MARGIN_KEYSTORE_PATH=$RUNNER_TEMP/margin-release.keystore" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cd android && ./gradlew assembleRelease -PmarginVariant=${{ steps.variant.outputs.variant }} --no-daemon --stacktrace

      - name: Remove the release key
        if: always() && steps.variant.outputs.variant == 'release'
        run: rm -f "$RUNNER_TEMP/margin-release.keystore"

      - name: Name the APK
        id: name
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="v$(node -p "require('./app.json').expo.version")"
          fi
          SRC=android/app/build/outputs/apk/release/app-release.apk
          DST="margin-${VERSION}-${{ steps.variant.outputs.variant }}-android.apk"
          cp "$SRC" "$DST"
          echo "file=${DST}" >> "$GITHUB_OUTPUT"
          ls -l "$DST"

      # Always uploaded, so a workflow_dispatch run can be downloaded without a tag.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: margin-android-apk-${{ steps.variant.outputs.variant }}
          path: margin-*-android.apk
          if-no-files-found: error

      - name: Create release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: margin-*-android.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
